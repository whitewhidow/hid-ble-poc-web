<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC-KBD control</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#0d1117; color:#e6edf3; padding:20px; max-width:520px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:16px; }
  button { padding:12px 16px; border:0; border-radius:10px; font-size:16px; font-weight:600; color:#04181b; background:#22d3e0; cursor:pointer; }
  button.sec { background:transparent; color:#e6edf3; border:1px solid #30363d; }
  button:disabled { opacity:.45; }
  input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #30363d; background:#161b22; color:#e6edf3; font-size:16px; margin:10px 0; }
  .row { display:flex; gap:8px; }
  .row button { flex:0 0 auto; }
  .row input { margin:0; }
  #stat { font-size:13px; color:#8b949e; margin-top:10px; }
  #log { margin-top:12px; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; min-height:60px; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
<h1>🐷 PoC-KBD control</h1>
<div class="sub">Connect to the board over Bluetooth, then send text — the board types it into the paired PC over BLE-HID. Chrome/Edge (Android or desktop), served from https or localhost.</div>

<button id="connect" style="width:100%">Connect to PoC-KBD</button>
<div id="stat"></div>

<div id="app" hidden>
  <div class="row" style="margin-top:14px">
    <input id="text" placeholder="text to type on the PC" value="hello from my phone">
    <button id="send">Send</button>
  </div>
  <div id="log"></div>
</div>

<script>
const SVC = 'a0c50000-1234-4b0a-9c5e-000000000000';
const RX  = 'a0c50001-1234-4b0a-9c5e-000000000000';
const TX  = 'a0c50002-1234-4b0a-9c5e-000000000000';
const $ = id => document.getElementById(id);
function log(m){ const e=$('log'); e.textContent += m+'\n'; e.scrollTop = e.scrollHeight; }

let rxCh = null;

$('connect').onclick = async () => {
  if (!navigator.bluetooth) { $('stat').textContent = '✖ Web Bluetooth unavailable — use Chrome/Edge, not iOS/Safari.'; return; }
  try {
    $('stat').textContent = 'requesting device…';
    const dev = await navigator.bluetooth.requestDevice({ filters:[{ name:'PoC-KBD' }], optionalServices:[SVC] });
    dev.addEventListener('gattserverdisconnected', () => { $('stat').textContent = '⚠ disconnected'; $('app').hidden = true; $('connect').hidden = false; });
    const g = await dev.gatt.connect();
    const svc = await g.getPrimaryService(SVC);
    rxCh = await svc.getCharacteristic(RX);
    try {
      const txCh = await svc.getCharacteristic(TX);
      await txCh.startNotifications();
      txCh.addEventListener('characteristicvaluechanged', e => log('board: ' + new TextDecoder().decode(e.target.value)));
    } catch(_) {}
    $('stat').textContent = '✔ connected to ' + (dev.name || 'PoC-KBD');
    $('connect').hidden = true; $('app').hidden = false;
    $('text').focus();
  } catch (e) { $('stat').textContent = '✖ ' + e.message; }
};

async function send() {
  const t = $('text').value;
  if (!t || !rxCh) return;
  try {
    const data = new TextEncoder().encode(t);
    if (rxCh.writeValueWithoutResponse) await rxCh.writeValueWithoutResponse(data);
    else await rxCh.writeValue(data);
    log('sent: ' + t);
  } catch (e) { log('✖ ' + e.message); }
}
$('send').onclick = send;
$('text') && ($('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); }));
</script>
</body>
</html>
